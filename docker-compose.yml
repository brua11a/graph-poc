services:
  neo4j:
    build: .
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
    volumes:
      - neo4j_data:/data
      - ./import:/import

  init:
    image: neo4j:2026.07.1-enterprise
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
    volumes:
      - ./queries:/queries
      - ./import:/import
      - ./init.sh:/init.sh
    entrypoint: ["bash", "/init.sh"]


volumes:
  neo4j_data:
